name: Update and publish dashboard

on:
  workflow_dispatch:
  schedule:
    # Hourly, at minute 17.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore rainfall cache
        uses: actions/cache@v4
        with:
          path: rain-cache.json
          key: rainfall-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rainfall-v2-
      - name: Fetch lake levels
        run: python update_data.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
